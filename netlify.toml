[build]
  publish = "public"

# ลิงก์สั้นของแต่ละประชุม: /m/WS-02-2570 → หน้าแบบตอบรับ
[[redirects]]
  from = "/m/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # accounts.google.com/gsi = ปุ่ม Sign in with Google ในหน้าผู้ดูแล
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; img-src 'self' data: https://*.googleusercontent.com; form-action 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
